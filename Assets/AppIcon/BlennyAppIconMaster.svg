      <stop offset="0.42" stop-color="#83DDD1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2DA7AE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cave" cx="0.46" cy="0.36" r="0.75">
