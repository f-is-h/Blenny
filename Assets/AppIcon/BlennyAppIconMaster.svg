    <path id="stoneRing" fill-rule="evenodd" d="M46 531 C42 260 225 78 495 58 C759 38 966 215 979 493 C994 774 825 960 538 973 C247 985 57 826 46 531Z M158 573 C150 390 280 218 493 190 C704 160 857 300 870 510 C884 666 820 761 706 796 C632 818 584 816 520 816 C456 816 398 818 319 796 C213 766 165 691 158 573Z"/>

