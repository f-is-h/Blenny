<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Blenny app icon v12 with softened eye-back shadows and restored v8 lower-eye curves</title>
  <desc>Deterministic layered 2.5D artwork for the Blenny macOS app icon. The system applies the final rounded-rectangle mask.</desc>

  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
