name: Development checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert supported hosted toolchain
        run: zsh scripts/ci-toolchain.sh
      - name: Validate release tooling
        run: |
          python3 scripts/release_tools.py check
          python3 scripts/test-release-tools.py
          python3 scripts/test-appcast.py
          python3 scripts/test-ci-release.py
          python3 scripts/check-workflows.py
      - name: Reconcile prepared release contributions
        run: python3 scripts/release_tools.py coverage
      - name: Check development release entry
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check-change-entry.py --base "$CHANGE_BASE"
      - name: Debug and ordinary Release tests and builds
        run: |
          mkdir -p LocalData/ci
          set -o pipefail
          zsh scripts/verify-local.sh 2>&1 | tee LocalData/ci/verification.log
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: LocalData/ci/*.log
          if-no-files-found: ignore
          retention-days: 14
